<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="环球时报电子化版本导航">
  <title>环球时报电子化｜版本导航</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --paper: #f6f4ef;
      --card: rgba(255, 255, 255, 0.92);
      --accent: #a71930;
      --line: rgba(23, 32, 51, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 85% 10%, rgba(167, 25, 48, 0.09), transparent 28rem),
        var(--paper);
      font-family: "Noto Serif SC", "Songti SC", STSong, Georgia, serif;
    }

    main {
      width: min(960px, calc(100% - 36px));
      margin: 0 auto;
      padding: 72px 0 80px;
    }

    header { margin-bottom: 42px; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font: 700 13px/1.4 system-ui, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 68px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 650px;
      margin: 20px 0 0;
      color: var(--muted);
      font: 17px/1.8 system-ui, sans-serif;
    }

    .project-note {
      max-width: 760px;
      margin: 28px 0 0;
      padding: 20px 24px;
      color: var(--ink);
      background: rgba(167, 25, 48, 0.07);
      border-left: 4px solid var(--accent);
      border-radius: 0 12px 12px 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.8;
    }

    .contributor-note {
      max-width: 760px;
      margin: 12px 0 0;
      color: var(--accent);
      font: 700 16px/1.8 system-ui, sans-serif;
      letter-spacing: 0.02em;
    }

    .versions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    article a {
      display: flex;
      min-height: 220px;
      padding: 30px;
      flex-direction: column;
      justify-content: space-between;
      color: inherit;
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(23, 32, 51, 0.05);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    article a:hover,
    article a:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(167, 25, 48, 0.35);
      box-shadow: 0 16px 38px rgba(23, 32, 51, 0.1);
      outline: none;
    }

    .status {
      color: var(--accent);
      font: 700 13px/1.4 system-ui, sans-serif;
      letter-spacing: 0.08em;
    }

    h2 {
      margin: 22px 0 8px;
      font-size: clamp(26px, 4vw, 34px);
      line-height: 1.35;
    }

    .description {
      margin: 0;
      color: var(--muted);
      font: 15px/1.7 system-ui, sans-serif;
    }

    .enter {
      margin-top: 28px;
      color: var(--muted);
      font: 14px/1.4 system-ui, sans-serif;
    }

    footer {
      margin-top: 42px;
      padding-top: 22px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font: 13px/1.6 system-ui, sans-serif;
    }

    @media (max-width: 680px) {
      main { padding: 48px 0 56px; }
      .versions { grid-template-columns: 1fr; }
      article a { min-height: 190px; padding: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Digital Editions</p>
      <h1>环球时报电子化</h1>
      <p class="intro">本项目按版本收录《环球时报》电子化文稿。请选择一个版本进入文章目录。</p>
      <p class="project-note">在英明的昊高乐陛下的指示下，法兰西文化局重启了《环球时报》电子化的伟大项目；</p>
      <p class="contributor-note">如果您也想成为贡献者，敬请致函昊高乐陛下</p>
    </header>

    <section class="versions" aria-label="版本列表">
      <article>
        <a href="./%E7%8E%AF%E7%90%83%E6%97%B6%E6%8A%A5%201.0/">
          <div>
            <span class="status">已收录 · 第一版</span>
            <h2>环球时报 1.0</h2>
            <p class="description">浏览当前已完成电子化的时评、人物、论坛、调研与特别专栏文章。</p>
          </div>
          <span class="enter">进入版本 →</span>
        </a>
      </article>
    </section>

    <footer>后续版本将以独立目录继续收录，并在此统一提供入口。</footer>
  </main>
</body>
</html>
