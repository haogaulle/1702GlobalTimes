<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="高峰论坛博客：法兰西民族解放运动号外">
  <title>号外｜法兰西民族解放运动｜高峰论坛</title>
  <style>
    :root { --navy: #17365d; --deep-navy: #0b2442; --red: #ba0c2f; --ink: #20242a; --muted: #6f7782; --line: #dfe4e8; --paper: #fff; --page: #f3f5f6; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--page); font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; }
    .top-line { height: 5px; background: var(--navy); }
    .masthead { border-bottom: 1px solid var(--line); background: var(--paper); }
    .masthead-inner { width: min(1120px, calc(100% - 40px)); height: 94px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: baseline; gap: 14px; color: var(--navy); white-space: nowrap; }
    .brand strong { font-family: STKaiti, KaiTi, serif; font-size: 42px; line-height: 1; letter-spacing: -2px; }
    .brand span { padding-left: 14px; border-left: 1px solid #d9d9d9; color: #555; font-size: 18px; letter-spacing: 4px; }
    .slogan { color: #999; font: 14px/1.6 SimSun, serif; }
    main { width: min(830px, calc(100% - 40px)); margin: 26px auto 56px; background: var(--paper); box-shadow: 0 1px 5px rgb(0 0 0 / 6%); }
    article { width: 100%; }
    .post-head { display: flex; align-items: center; gap: 13px; padding: 34px 40px 16px; }
    .avatar { display: grid; flex: 0 0 52px; width: 52px; height: 52px; place-items: center; overflow: hidden; border: 1px solid #d9dee3; border-radius: 50%; background: #fff; }
    .flag { width: 42px; height: 28px; border: 1px solid rgb(0 0 0 / 8%); background: linear-gradient(90deg, #0055a4 0 33.333%, #fff 33.333% 66.666%, #ef4135 66.666%); }
    .account { min-width: 0; }
    .account-name { color: #17202a; font-size: 17px; font-weight: 700; }
    .verified { display: inline-grid; width: 19px; height: 19px; margin-left: 5px; place-items: center; border-radius: 50%; color: #fff; background: var(--navy); font: 700 12px/1 Arial, sans-serif; vertical-align: 2px; }
    .account-meta { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .post-body { padding: 4px 40px 32px; }
    .post-title { margin: 4px 0 14px; color: var(--red); font-family: "Noto Serif SC", STSong, SimSun, serif; font-size: 23px; font-weight: 700; }
    .post-text { margin: 0; font-family: "Noto Serif SC", STSong, SimSun, serif; font-size: 19px; line-height: 2; text-align: justify; }
    .post-time { margin-top: 22px; color: var(--muted); font-size: 13px; }
    .post-meta { display: flex; gap: 26px; margin: 0 40px; padding: 13px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    footer { padding: 28px 20px 36px; border-top: 3px solid var(--deep-navy); color: #b8c0c9; background: #202b37; text-align: center; font-size: 13px; line-height: 1.8; }
    @media (max-width: 680px) {
      .masthead-inner { width: calc(100% - 28px); height: 74px; }
      .brand strong { font-size: 32px; }
      .brand span { font-size: 15px; letter-spacing: 2px; }
      .slogan { display: none; }
      main { width: 100%; margin: 12px 0 0; box-shadow: none; }
      .post-head { padding: 24px 20px 13px; }
      .post-body { padding: 3px 18px 24px; }
      .post-text { font-size: 17px; line-height: 1.9; }
      .post-meta { margin: 0 20px; }
    }
  </style>
</head>
<body>
  <div class="top-line"></div>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand"><strong>环球时报</strong><span>高峰论坛</span></div>
      <div class="slogan">汇集各国政府声音　直面全球议题</div>
    </div>
  </header>
  <main>
    <article aria-label="昊高乐发布的博客帖子">
      <header class="post-head">
        <div class="avatar"><div class="flag" role="img" aria-label="法国国旗图案"></div></div>
        <div class="account">
          <div class="account-name">昊高乐 <span class="verified" title="认证账号" aria-label="认证账号">V</span></div>
          <div class="account-meta">法兰西民族解放运动</div>
        </div>
      </header>
      <div class="post-body">
        <h1 class="post-title">号外</h1>
        <p class="post-text">法兰西民族解放运动，我们需要（世界人民）的帮助！</p>
        <div class="post-time"><time datetime="2026-08-25">2026年8月25日</time> · 发布于高峰论坛</div>
      </div>
      <div class="post-meta"><span>紧急消息</span><span>政府博客</span></div>
    </article>
  </main>
</body>
</html>
